spring:
  application:
    name: taskflow

  datasource:
    url: jdbc:h2:mem:taskflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: TaskFlowPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_batch_fetch_size: 25
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 25

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

taskflow:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForTaskFlowThatIsAtLeast256BitsLong!}
    expiration-ms: 86400000   # 24h

  executor:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500
    keep-alive-seconds: 60
    thread-name-prefix: taskflow-worker-

  assignment:
    strategy: LEAST_LOADED    # LEAST_LOADED | ROUND_ROBIN | PRIORITY_BASED

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
